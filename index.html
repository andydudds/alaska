<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duddleston Expeditions</title>
<meta name="description" content="The Duddleston family travel archive. Where we go, and what we shot while we were there.">
<meta property="og:title" content="Duddleston Expeditions">
<meta property="og:description" content="The Duddleston family travel archive. Where we go, and what we shot while we were there.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://andydudds.github.io/alaska/">
<meta property="og:image" content="https://andydudds.github.io/alaska/og-image.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Duddleston Expeditions">
<meta name="twitter:description" content="The Duddleston family travel archive.">
<meta name="twitter:image" content="https://andydudds.github.io/alaska/og-image.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FFD000'/%3E%3Ctext x='16' y='23' font-family='Arial Black,sans-serif' font-weight='900' font-size='15' fill='%23003087' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08090e;--card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--text:#e8e6e1;--dim:#8b90b0;--hot:#ff2d55;--cyan:#00f0d4;--gold:#ffd000;--blue:#4d9eff;--purple:#b44dff;--orange:#ff8a3d;--green:#34d399}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;min-height:100vh}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px}
.glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.glow-1{width:400px;height:400px;background:rgba(255,45,85,.06);top:-100px;right:-100px}
.glow-2{width:500px;height:500px;background:rgba(0,240,212,.04);bottom:-150px;left:-150px}
.glow-3{width:300px;height:300px;background:rgba(180,77,255,.04);top:50%;left:50%;transform:translate(-50%,-50%)}
.wrap{max-width:760px;margin:0 auto;padding:80px 24px 80px;position:relative;z-index:1}
.eyebrow{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--cyan);margin-bottom:16px;text-shadow:0 0 20px rgba(0,240,212,.3)}
.title{font-size:clamp(48px,11vw,84px);font-weight:900;line-height:.92;margin-bottom:18px;background:linear-gradient(135deg,var(--text) 0%,var(--cyan) 40%,var(--gold) 70%,var(--hot) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-size:17px;color:var(--dim);margin-bottom:56px;max-width:520px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.trip-card{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;backdrop-filter:blur(10px);position:relative}
.trip-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .2s;z-index:2}
.trip-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.16);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.trip-card:hover::before{opacity:1}
.trip-cover{height:160px;background:#11131a center/cover no-repeat;position:relative}
.trip-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,14,.85),rgba(8,9,14,.05))}
.trip-body{padding:18px 20px 22px}
.trip-status{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;margin-bottom:10px}
.st-upcoming{background:rgba(0,240,212,.1);color:var(--cyan);border:1px solid rgba(0,240,212,.25)}
.st-active{background:rgba(255,45,85,.12);color:var(--hot);border:1px solid rgba(255,45,85,.25)}
.st-past{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border)}
.trip-name{font-size:26px;font-weight:900;line-height:1.05;margin-bottom:2px}
.trip-dates{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--gold);margin-bottom:10px}
.trip-sub{font-size:13px;color:var(--dim);margin-bottom:8px;font-weight:600}
.trip-blurb{font-size:13px;color:rgba(232,230,225,.78);line-height:1.6}
.empty{color:var(--dim);font-size:15px;padding:40px 0}
.foot{margin-top:64px;font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,.18);letter-spacing:2px}
@media(max-width:480px){.trip-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<!-- mountain silhouettes (shared visual language with the trip pages) -->
<svg style="position:fixed;bottom:0;left:0;width:100%;height:40vh;pointer-events:none;z-index:0;display:block" viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<path d="M0,400 L0,280 L80,240 L160,260 L240,200 L320,220 L400,160 L440,180 L520,120 L600,150 L680,100 L720,130 L800,80 L880,120 L960,90 L1040,140 L1120,100 L1200,160 L1280,130 L1360,180 L1440,150 L1440,400Z" fill="rgba(0,240,212,.018)"/>
<path d="M0,400 L0,320 L100,290 L200,310 L300,260 L380,280 L460,230 L540,250 L620,200 L700,230 L780,180 L860,210 L940,170 L1020,200 L1100,160 L1180,190 L1260,170 L1340,210 L1440,190 L1440,400Z" fill="rgba(180,77,255,.015)"/>
</svg>

<div class="wrap">
<div class="eyebrow">Family Travel Archive</div>
<h1 class="title">Expeditions.</h1>
<p class="tagline" id="tagline">Where the family goes, and what we shot while we were there.</p>
<div class="trip-grid" id="trip-grid"><div class="empty">Loading trips…</div></div>
<div class="foot">DUDDLESTON &mdash; FIELD NOTES</div>
</div>

<script>
(function(){
  var ACCENTS = {cyan:'var(--cyan)'};
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function statusBadge(s){
    s = (s || '').toLowerCase();
    if(s === 'active' || s === 'live') return '<span class="trip-status st-active">In progress</span>';
    if(s === 'past' || s === 'done')   return '<span class="trip-status st-past">Archived</span>';
    return '<span class="trip-status st-upcoming">Upcoming</span>';
  }
  function card(t){
    var accent = t.accent || '#00f0d4';
    var cover = t.cover ? '<div class="trip-cover" style="background-image:url(\''+esc(t.cover)+'\')"></div>' : '';
    var sub = t.subtitle ? '<div class="trip-sub">'+esc(t.subtitle)+'</div>' : '';
    var blurb = t.blurb ? '<div class="trip-blurb">'+esc(t.blurb)+'</div>' : '';
    return '<a class="trip-card" href="./'+encodeURIComponent(t.slug)+'/" style="--accent:'+esc(accent)+'">'+
      '<span style="position:absolute;top:0;left:0;right:0;height:3px;background:'+esc(accent)+';opacity:.9"></span>'+
      cover+
      '<div class="trip-body">'+statusBadge(t.status)+
        '<div class="trip-name">'+esc(t.title)+'</div>'+
        '<div class="trip-dates">'+esc(t.dates || '')+'</div>'+
        sub+blurb+
      '</div></a>';
  }
  fetch('trips.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(cfg){
    if(cfg.archive){
      if(cfg.archive.tagline) document.getElementById('tagline').textContent = cfg.archive.tagline;
      if(cfg.archive.title)  document.title = cfg.archive.title;
    }
    var trips = (cfg.trips || []).slice();
    var grid = document.getElementById('trip-grid');
    if(!trips.length){ grid.innerHTML = '<div class="empty">No trips yet.</div>'; return; }
    grid.innerHTML = trips.map(card).join('');
  }).catch(function(){
    document.getElementById('trip-grid').innerHTML = '<div class="empty">Couldn’t load trips.json.</div>';
  });
})();
</script>
</body>
</html>
